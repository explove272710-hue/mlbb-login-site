<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Screen</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #000;
        }

        .loading-container {
            position: relative;
            width: 100%;
            height: 100vh;
            background-image: url('zin ko.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .loading-text {
            font-size: 35px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
        }
    </style>
</head>
<body>

    <div class="loading-container">
        <div class="overlay"></div>
        
        <div class="content">
            <div class="loading-text" id="loadingText">Loading... 0%</div>
        </div>
    </div>

    <script>
        const loadingText = document.getElementById('loadingText');
        
        // စက္ကန့် ၃၀ (မီလီစက္ကန့် ၃၀၀၀၀) ကြာအောင် သတ်မှတ်ထားသည်
        const totalDuration = 30000; 
        const intervalTime = 300; // ဘယ်လောက်နှုန်းနဲ့ တက်မလဲ (0.3 စက္ကန့်တစ်ကြိမ်)
        const totalSteps = totalDuration / intervalTime;
        const increment = 100 / totalSteps;
        
        let currentProgress = 0;

        const timer = setInterval(() => {
            currentProgress += increment;
            
            if (currentProgress >= 100) {
                currentProgress = 100;
                loadingText.innerText = "Loading... 100%";
                clearInterval(timer);
                
                // ၁၀၀% ပြည့်တာနဲ့ နောက်တစ်မျက်နှာ (home.html) ကို သွားမည်
                setTimeout(() => {
                    window.location.href = "home.html";
                }, 500);
            } else {
                loadingText.innerText = Loading... ${Math.floor(currentProgress)}%;
            }
        }, intervalTime);
    </script>

</body>
</html>
